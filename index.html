<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Art em Foco — Cidio Sistemas</title><style>*{box-sizing:border-box}body{margin:0;background:#11141c;color:#eef2ff;font:14px system-ui}header{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 15px;background:#1c2130;border-bottom:1px solid #353b50}header b{font-size:18px;color:#91b7ff}main{height:calc(100dvh - 113px);display:flex;overflow:hidden}aside{width:62px;display:flex;flex-direction:column;gap:6px;padding:8px;background:#1b2130;overflow:auto}button{border:1px solid #444b62;border-radius:9px;background:#292f42;color:white;padding:9px;cursor:pointer}button.active{background:#4667b3}aside button{min-height:42px}#stage{position:relative;flex:1;overflow:hidden;touch-action:none;background:#262a36;display:grid;place-items:center}#paper{position:absolute;transform-origin:center;box-shadow:0 8px 30px #0008;background:white;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}footer{display:flex;gap:8px;align-items:center;padding:7px;background:#1c2130;height:58px;overflow:auto}input[type=range]{width:90px}#layers{position:absolute;right:8px;top:8px;background:#1b2130ee;padding:10px;border-radius:12px;display:none;max-height:75%;overflow:auto;min-width:180px}#layers button{margin:3px}small{color:#aab2c7}#zoom{white-space:nowrap}#layers button.selected{background:#4667b3}@media(max-width:600px){footer{gap:5px;padding:5px}footer button{padding:7px}header{padding:0 8px}#size{width:65px}}</style></head><body><header><b>🎨 Art em Foco</b><span><button id="undo">↶</button> <button id="redo">↷</button> <button id="save">Salvar PNG</button></span></header><main><aside id="tools"><button data-tool="brush" class="active" title="Pincel">🖌️</button><button data-tool="eraser" title="Borracha transparente">◻️</button><button data-tool="fill" title="Balde">🪣</button><button data-tool="picker" title="Conta-gotas">💧</button><button data-tool="line" title="Linha">📏</button><button data-tool="rect" title="Retângulo">▢</button><button data-tool="ellipse" title="Elipse">◯</button><button id="layerBtn" title="Camadas">▤</button></aside><div id="stage"><div id="paper"></div><div id="layers"><b>Camadas</b><div id="layerList"></div><button id="addLayer">+ Nova camada</button></div></div></main><footer><input type="color" id="color" value="#303030"><label>Tamanho <input type="range" id="size" min="1" max="100" value="8"></label><label>Opac. <input type="range" id="opacity" min="1" max="100" value="100"></label><button id="minus">−</button><span id="zoom">100%</span><button id="plus">+</button><button id="fit">Ajustar</button></footer><script>
const W=1000,H=1000,stage=document.querySelector('#stage'),paper=document.querySelector('#paper'),color=document.querySelector('#color'),size=document.querySelector('#size'),opacity=document.querySelector('#opacity');let tool='brush',scale=1,panX=0,panY=0,layers=[],selected=0,history=[],future=[],drawing=false,last=null,first=null,pointers=new Map(),gesture=null;paper.style.width=W+'px';paper.style.height=H+'px';
function newLayer(){let c=document.createElement('canvas');c.width=W;c.height=H;paper.append(c);layers.push(c);selected=layers.length-1;updateLayers();return c}
function ctx(){return layers[selected].getContext('2d',{willReadFrequently:true})}
function updateLayers(){document.querySelector('#layerList').innerHTML='';layers.forEach((c,i)=>{c.style.zIndex=i;let b=document.createElement('button');b.textContent='Camada '+(i+1);b.className=i===selected?'selected':'';b.onclick=()=>{selected=i;updateLayers()};document.querySelector('#layerList').prepend(b)})}
function apply(){paper.style.transform='translate('+panX+'px,'+panY+'px) scale('+scale+')';document.querySelector('#zoom').textContent=Math.round(scale*100)+'%';layers.forEach(c=>c.style.imageRendering=scale>=8?'pixelated':'auto')}
function fit(){scale=Math.min((stage.clientWidth-35)/W,(stage.clientHeight-35)/H);panX=0;panY=0;apply()}function zoomTo(v){scale=Math.min(64,Math.max(.08,v));apply()}
function point(e){let r=paper.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
function snapshot(){history.push(layers.map(c=>c.toDataURL()));if(history.length>25)history.shift();future=[]}
async function restore(s){while(layers.length<s.length)newLayer();while(layers.length>s.length){layers.pop().remove()}await Promise.all(s.map((src,i)=>new Promise(resolve=>{let im=new Image();im.onload=()=>{let g=layers[i].getContext('2d');g.clearRect(0,0,W,H);g.drawImage(im,0,0);resolve()};im.src=src})));selected=Math.min(selected,layers.length-1);updateLayers()}
function undo(){if(!history.length)return;future.push(layers.map(c=>c.toDataURL()));restore(history.pop())}function redo(){if(!future.length)return;history.push(layers.map(c=>c.toDataURL()));restore(future.pop())}
function stroke(a,b){let g=ctx();g.save();g.globalAlpha=+opacity.value/100;g.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';g.strokeStyle=tool==='eraser'?'black':color.value;g.lineWidth=+size.value;g.lineCap='round';g.lineJoin='round';g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.restore()}
function shape(a,b){let g=ctx();g.save();g.globalAlpha=+opacity.value/100;g.strokeStyle=color.value;g.lineWidth=+size.value;g.lineCap='round';g.beginPath();if(tool==='line'){g.moveTo(a.x,a.y);g.lineTo(b.x,b.y)}else if(tool==='rect')g.rect(a.x,a.y,b.x-a.x,b.y-a.y);else g.ellipse((a.x+b.x)/2,(a.y+b.y)/2,Math.max(.1,Math.abs(b.x-a.x)/2),Math.max(.1,Math.abs(b.y-a.y)/2),0,0,Math.PI*2);g.stroke();g.restore()}
function composite(){let c=document.createElement('canvas');c.width=W;c.height=H;let g=c.getContext('2d',{willReadFrequently:true});layers.forEach(l=>g.drawImage(l,0,0));return g.getImageData(0,0,W,H).data}
function fill(p){let x=Math.floor(p.x),y=Math.floor(p.y);if(x<0||y<0||x>=W||y>=H)return;let src=composite(),start=(y*W+x)*4,base=src.slice(start,start+4),seen=new Uint8Array(W*H),stack=[y*W+x],g=ctx(),dest=g.getImageData(0,0,W,H),d=dest.data,hex=color.value,rr=parseInt(hex.slice(1,3),16),gg=parseInt(hex.slice(3,5),16),bb=parseInt(hex.slice(5,7),16),alpha=+opacity.value/100,limit=24;let n=0;while(stack.length){let i=stack.pop();if(seen[i])continue;seen[i]=1;let q=i*4;if(Math.abs(src[q]-base[0])+Math.abs(src[q+1]-base[1])+Math.abs(src[q+2]-base[2])+Math.abs(src[q+3]-base[3])>limit)continue;let old=d[q+3]/255,na=alpha+old*(1-alpha);d[q]=Math.round((rr*alpha+d[q]*old*(1-alpha))/na);d[q+1]=Math.round((gg*alpha+d[q+1]*old*(1-alpha))/na);d[q+2]=Math.round((bb*alpha+d[q+2]*old*(1-alpha))/na);d[q+3]=Math.round(na*255);if(i%W)stack.push(i-1);if(i%W<W-1)stack.push(i+1);if(i>=W)stack.push(i-W);if(i<W*(H-1))stack.push(i+W);if(++n>W*H)break}g.putImageData(dest,0,0)}
stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){drawing=false;gesture=[...pointers.values()];return}if(pointers.size>2)return;let p=point(e);if(tool==='picker'){let d=composite(),i=(Math.floor(p.y)*W+Math.floor(p.x))*4;if(i>=0&&i<d.length)color.value='#'+[d[i],d[i+1],d[i+2]].map(v=>v.toString(16).padStart(2,'0')).join('');return}snapshot();if(tool==='fill'){fill(p);return}drawing=true;last=p;first=p;if(tool==='brush'||tool==='eraser')stroke(p,{x:p.x+.01,y:p.y+.01})});
stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let old=[...pointers.values()];pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2){let now=[...pointers.values()],dist=v=>Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y),ratio=dist(now)/Math.max(1,dist(old));panX+=(now[0].x+now[1].x-old[0].x-old[1].x)/2;panY+=(now[0].y+now[1].y-old[0].y-old[1].y)/2;zoomTo(scale*ratio);return}if(!drawing)return;let p=point(e);if(tool==='brush'||tool==='eraser')stroke(last,p);last=p});
function end(e){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(pointers.size){drawing=false;return}if(drawing&&['line','rect','ellipse'].includes(tool))shape(first,last);drawing=false}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});
document.querySelector('#layerBtn').onclick=()=>{let p=document.querySelector('#layers');p.style.display=p.style.display==='block'?'none':'block'};document.querySelector('#addLayer').onclick=()=>{snapshot();newLayer()};document.querySelector('#undo').onclick=undo;document.querySelector('#redo').onclick=redo;document.querySelector('#minus').onclick=()=>zoomTo(scale/1.5);document.querySelector('#plus').onclick=()=>zoomTo(scale*1.5);document.querySelector('#fit').onclick=fit;document.querySelector('#save').onclick=()=>{let c=document.createElement('canvas');c.width=W;c.height=H;let g=c.getContext('2d');layers.forEach(l=>g.drawImage(l,0,0));let a=document.createElement('a');a.download='art-em-foco.png';a.href=c.toDataURL('image/png');a.click()};newLayer();addEventListener('resize',()=>{if(scale<1)fit()});fit();
</script></body></html>
